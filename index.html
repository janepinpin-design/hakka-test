<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>客語線上程度測驗．四縣腔</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F6F1E4;
    --paper-deep: #EFE7D4;
    --ink: #2A2420;
    --ink-soft: #6B5F52;
    --indigo-1: #C9D6E3;
    --indigo-2: #8FA8C4;
    --indigo-3: #5A7CA6;
    --indigo-4: #33517A;
    --indigo-5: #16273F;
    --clay: #A8462F;
    --clay-soft: #F1DDD3;
    --moss: #4C6B4F;
    --moss-soft: #DCE6D4;
    --gold: #B98A2E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 10% -10%, #FBF7EC 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #EFE4CE 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .font-display{font-family:'Noto Serif TC', serif;}
  ::selection{background:var(--indigo-3); color:#fff;}

  /* subtle woven-cloth texture band used behind headers */
  .cloth-band{
    background-image:
      repeating-linear-gradient(135deg, rgba(51,81,122,0.05) 0px, rgba(51,81,122,0.05) 2px, transparent 2px, transparent 10px);
  }

  .fade-in{ animation: fadeIn .5s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .btn-primary{
    background:var(--indigo-4);
    color:#fff;
    transition: background .18s ease, transform .12s ease;
  }
  .btn-primary:hover{ background:var(--indigo-5); }
  .btn-primary:active{ transform: scale(0.98); }
  .btn-primary:disabled{ background:#B9B2A4; cursor:not-allowed; }

  .btn-ghost{
    background:transparent;
    border:1.5px solid var(--indigo-3);
    color:var(--indigo-5);
    transition: all .15s ease;
  }
  .btn-ghost:hover{ background:var(--indigo-1); }

  /* Level swatches — indigo dye depth I (light) -> V (dark) */
  .swatch{
    width:34px; height:34px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif TC', serif; font-weight:700; font-size:13px;
    border:2px solid transparent;
    color:#fff;
    transition: all .25s ease;
  }
  .swatch[data-lv="I"]{ background:var(--indigo-1); color:var(--indigo-5); }
  .swatch[data-lv="II"]{ background:var(--indigo-2); color:#fff; }
  .swatch[data-lv="III"]{ background:var(--indigo-3); color:#fff; }
  .swatch[data-lv="IV"]{ background:var(--indigo-4); color:#fff; }
  .swatch[data-lv="V"]{ background:var(--indigo-5); color:#fff; }
  .swatch.active{
    transform: scale(1.18);
    box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--gold);
  }
  .swatch.dim{ opacity:.35; }

  /* accent select cards */
  .accent-card{
    border:1.5px solid var(--paper-deep);
    background:#fff;
    transition: all .18s ease;
    cursor:pointer;
  }
  .accent-card:hover{ border-color:var(--indigo-3); transform:translateY(-2px); }
  .accent-card.selected{
    border-color:var(--indigo-4);
    background: linear-gradient(180deg, #fff, var(--indigo-1) 220%);
    box-shadow: 0 6px 18px -10px rgba(22,39,63,.45);
  }
  .accent-card.selected .accent-dot{ background:var(--indigo-4); }
  .accent-dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--paper-deep);
    transition: background .18s ease;
  }

  /* question card */
  .q-card{
    background:#fff;
    border:1px solid var(--paper-deep);
    box-shadow: 0 10px 30px -18px rgba(22,39,63,.35);
  }

  .opt-btn{
    background:#fff;
    border:1.5px solid var(--paper-deep);
    text-align:left;
    transition: all .15s ease;
    cursor:pointer;
  }
  .opt-btn:hover{ border-color:var(--indigo-3); background:var(--indigo-1); }
  .opt-btn.chosen{
    border-color:var(--indigo-4);
    background: var(--indigo-1);
  }

  .opt-audio-row{
    background:#fff;
    border:1.5px solid var(--paper-deep);
    transition: all .15s ease;
    cursor:pointer;
  }
  .opt-audio-row:hover{ border-color:var(--indigo-3); }
  .opt-audio-row.chosen{ border-color:var(--indigo-4); background:var(--indigo-1); }

  .img-opt{
    border:3px solid var(--paper-deep);
    background: var(--paper-deep);
    cursor:pointer;
    transition: all .15s ease;
    position:relative;
    overflow:hidden;
  }
  .img-opt:hover{ border-color:var(--indigo-3); }
  .img-opt.chosen{
    border-color:var(--indigo-4);
    box-shadow: 0 0 0 3px var(--indigo-2);
  }
  .img-opt.chosen .check-badge{ opacity:1; transform:scale(1); }
  .check-badge{
    opacity:0; transform:scale(.5);
    transition: all .18s ease;
    background:var(--indigo-4);
  }

  .play-btn{
    background:var(--indigo-5);
    color:#fff;
    transition: all .15s ease;
  }
  .play-btn:hover{ background:var(--indigo-4); }
  .play-btn:active{ transform:scale(.96); }

  .mini-play{
    background:var(--indigo-1);
    color:var(--indigo-5);
    transition: all .15s ease;
    flex-shrink:0;
  }
  .mini-play:hover{ background:var(--indigo-2); color:#fff; }

  /* sound wave animation */
  .wave{ display:inline-flex; align-items:flex-end; gap:2px; height:14px; }
  .wave span{
    width:2.5px; background:currentColor; border-radius:2px;
    height:4px; opacity:.5;
  }
  .wave.playing span{ animation: waveBar .6s ease-in-out infinite; opacity:1; }
  .wave.playing span:nth-child(1){ animation-delay:0s; }
  .wave.playing span:nth-child(2){ animation-delay:.12s; }
  .wave.playing span:nth-child(3){ animation-delay:.24s; }
  .wave.playing span:nth-child(4){ animation-delay:.36s; }
  @keyframes waveBar{
    0%,100%{ height:4px; }
    50%{ height:14px; }
  }

  .tag-correct{ background:var(--moss-soft); color:var(--moss); }
  .tag-wrong{ background:var(--clay-soft); color:var(--clay); }

  /* 口說測驗：錄音按鈕與字元標準度標示 */
  .record-btn{
    background:var(--clay);
    box-shadow: 0 8px 20px -8px rgba(168,70,47,0.6);
    transition: all .15s ease;
  }
  .record-btn:hover{ background:#8f3b26; }
  .record-btn:active{ transform:scale(.96); }
  .record-btn.recording{ animation: recordPulse 1.1s ease-in-out infinite; }
  @keyframes recordPulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(168,70,47,0.55); }
    50%{ box-shadow: 0 0 0 14px rgba(168,70,47,0); }
  }

  .spinner{
    width:15px; height:15px; border-radius:50%;
    border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    animation: spin .7s linear infinite;
    display:inline-block;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .char-chip{
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 12px; border-radius:999px;
    font-family:'Noto Serif TC', serif; font-weight:600; font-size:15px;
    border:1.5px solid transparent;
  }
  .char-standard{ background:var(--moss-soft); color:var(--moss); border-color:var(--moss); }
  .char-nonstandard{ background:var(--clay-soft); color:var(--clay); border-color:var(--clay); }
  .char-chip-tag{ font-family:'Noto Sans TC', sans-serif; font-weight:500; font-size:10.5px; opacity:.85; }

  .result-item{
    border:1px solid var(--paper-deep);
    background:#fff;
  }

  .progress-track{
    height:6px; background:var(--paper-deep); border-radius:99px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:var(--indigo-4); border-radius:99px;
    transition: width .35s ease;
  }

  ::-webkit-scrollbar{ width:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--indigo-2); border-radius:99px; }
</style>
</head>

const LEVELS = ['I','II','III','IV','V'];
const ACCENTS = ['四縣腔','海陸腔','大埔腔','饒平腔','詔安腔','南四縣腔'];

// 口說測驗發音評分後端網址。留空字串時，網頁會依「目前是怎麼被打開的」自動判斷：
//   - 用瀏覽器直接開本機 HTML 檔案（file://）：無法連到任何後端，一律使用模擬評分。
//   - 網頁本身就是透過網址（http/https）架設起來的（例如整個網站含音檔一起放到
//     Vercel 上）：自動改用「跟目前網頁同一個網域」的 /api/score，不需要手動填網址。
// 如果您的評分後端跟網頁不同網域（例如網頁另外放在別的地方），才需要在這裡手動指定
// 完整網址（例如 'https://hakka-speaking-score.vercel.app'，結尾不要加斜線）。
const SCORING_API_BASE = '';

function scoringEndpointBase(){
  if (SCORING_API_BASE) return SCORING_API_BASE; // 手動指定的網址一律優先
  if (location.protocol === 'file:') return null; // 本機檔案，沒有後端可以連
  return ''; // 網頁本身是用網址開的：走同網域相對路徑
}

// ==================== 全域狀態 ====================
const state = {
  screen: 'accent',        // accent | reading | transitionA | listening | transitionB | speaking | result
  accent: null,
  reading: null,            // CAT 狀態物件
  listening: null,
  speaking: null,           // 口說測驗狀態物件
};

function makeCatState(bank){
  return {
    bank: bank,
    levelIdx: 1,               // 目前所在級別，起始第 II 級 (index 1)
    arrivedViaUpgrade: false,  // 目前級別是否是「剛升級」上來的
    streakCorrect: 0,          // 目前級別的連續答對數
    streakWrong: 0,            // 目前級別的連續答錯數
    totalAnswered: 0,
    usedIndices: new Set(),
    currentQuestionIndex: null, // 題庫中的 index
    finished: false,
    finalLevelIdx: null,       // 測驗結束後，判定的最終級別 index
    log: [],                   // {seq, level, question, options, userAnswerIdx, correctIdx, correct}
  };
}

// ==================== 出題邏輯 ====================
function pickQuestion(cat){
  const targetLevel = LEVELS[cat.levelIdx];
  let pool = cat.bank
    .map((q, idx) => ({ q, idx }))
    .filter(item => item.q.level === targetLevel && !cat.usedIndices.has(item.idx));

  if (pool.length === 0){
    // 該級別題目已用盡（保護機制）：由近至遠尋找其他級別的未用題目
    for (let d = 1; d < LEVELS.length; d++){
      const tryUp = cat.levelIdx + d, tryDown = cat.levelIdx - d;
      for (const tIdx of [tryUp, tryDown]){
        if (tIdx >= 0 && tIdx < LEVELS.length){
          const lvl = LEVELS[tIdx];
          const p2 = cat.bank.map((q,idx)=>({q,idx})).filter(item => item.q.level===lvl && !cat.usedIndices.has(item.idx));
          if (p2.length > 0){ pool = p2; break; }
        }
      }
      if (pool.length > 0) break;
    }
  }
  if (pool.length === 0) return null; // 全部題目都用過了

  const chosen = pool[Math.floor(Math.random() * pool.length)];
  cat.usedIndices.add(chosen.idx);
  cat.currentQuestionIndex = chosen.idx;
  return chosen.idx;
}

function startSection(sectionKey){
  const bank = sectionKey === 'reading' ? readingQuestions : listeningQuestions;
  const cat = makeCatState(bank);
  state[sectionKey] = cat;
  pickQuestion(cat);
}

function submitAnswer(sectionKey, chosenOptionIdx1based){
  const cat = state[sectionKey];
  const q = cat.bank[cat.currentQuestionIndex];
  const correct = (chosenOptionIdx1based === q.answer);

  cat.log.push({
    seq: cat.totalAnswered + 1,
    level: q.level,
    question: q.question,
    options: q.options,
    audio: q.audio || null,
    userAnswerIdx: chosenOptionIdx1based,
    correctIdx: q.answer,
    correct: correct,
  });

  cat.totalAnswered++;

  const TOP_IDX = LEVELS.length - 1;   // 第 V 級 index
  const BOTTOM_IDX = 0;                 // 第 I 級 index

  if (correct){
    cat.streakCorrect += 1;
    cat.streakWrong = 0;

    if (cat.streakCorrect >= 3){
      if (cat.levelIdx === TOP_IDX){
        // 已在最高級，連對 3 題即可判定程度為 V 級
        cat.finalLevelIdx = cat.levelIdx;
        cat.finished = true;
        return;
      }
      // 升一級
      cat.levelIdx += 1;
      cat.arrivedViaUpgrade = true;
      cat.streakCorrect = 0;
      cat.streakWrong = 0;
    }
  } else {
    cat.streakWrong += 1;
    cat.streakCorrect = 0;

    if (cat.streakWrong >= 2){
      if (cat.arrivedViaUpgrade){
        // 剛升級上來就連錯 2 題（湊不滿連對 3 題）
        // 可判定「上一級」即為受測者的程度
        cat.finalLevelIdx = cat.levelIdx - 1;
        cat.finished = true;
        return;
      }
      if (cat.levelIdx === BOTTOM_IDX){
        // 已在最低級，連錯 2 題即可判定程度為 I 級
        cat.finalLevelIdx = cat.levelIdx;
        cat.finished = true;
        return;
      }
      // 降一級
      cat.levelIdx -= 1;
      cat.arrivedViaUpgrade = false;
      cat.streakCorrect = 0;
      cat.streakWrong = 0;
    }
  }

  // 安全上限：答滿 30 題強制結束
  if (cat.totalAnswered >= 30){
    cat.finalLevelIdx = cat.levelIdx;
    cat.finished = true;
    return;
  }

  const next = pickQuestion(cat);
  if (next === null){
    // 題庫已用盡的保護機制
    cat.finalLevelIdx = cat.levelIdx;
    cat.finished = true;
  }
}

// ==================== 音效（真實音檔播放，失敗自動降級為嗶聲） ====================
// 防止音檔重疊：全域記錄目前正在播放的音檔／嗶聲與動畫，
// 每次觸發新的播放前，一律先強制停止前一個。
let audioCtx = null;
let playToken = 0;          // 每次 triggerPlay 遞增，用來讓舊的非同步回呼失效
let currentAudioEl = null;  // 目前正在播放的 <audio> 物件
let currentOsc = null;      // 目前正在播放的嗶聲 oscillator
let currentWaveId = null;   // 目前亮著的音波動畫元素 id

function stopCurrentPlayback(){
  playToken++; // 讓前一次呼叫殘留的非同步回呼（error / timeout / ended）失效
  if (currentAudioEl){
    try{ currentAudioEl.pause(); currentAudioEl.currentTime = 0; }catch(e){}
    currentAudioEl = null;
  }
  if (currentOsc){
    try{ currentOsc.stop(); }catch(e){}
    currentOsc = null;
  }
  if (currentWaveId){
    const el = document.getElementById(currentWaveId);
    if (el) el.classList.remove('playing');
    currentWaveId = null;
  }
}

function playBeep(durationSec = 0.2, freq = 440){
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + durationSec);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + durationSec + 0.02);
    currentOsc = osc;
    osc.onended = () => { if (currentOsc === osc) currentOsc = null; };
  }catch(e){ console.warn('Web Audio 無法播放：', e); }
}

function audioPath(filename){
  return 'audio/' + encodeURIComponent(filename);
}
function imagePath(filename){
  return 'images/' + encodeURIComponent(filename);
}

// path 為 null 時直接播放嗶聲；否則嘗試播放真實音檔，
// 若因路徑不存在／瀏覽器安全限制而載入失敗，自動降級為嗶聲，確保測驗不會卡住。
// 每次呼叫一律先停掉前一個仍在播放的音檔／嗶聲，避免重疊。
function triggerPlay(path, waveId){
  stopCurrentPlayback();
  const myToken = playToken;

  const wave = document.getElementById(waveId);
  const showWave = (on) => { if (wave) wave.classList.toggle('playing', on); };

  let settled = false;
  const fallbackBeep = () => {
    if (myToken !== playToken || settled) return;
    settled = true;
    playBeep(0.2, 440);
    currentWaveId = waveId;
    showWave(true);
    setTimeout(() => {
      if (myToken === playToken){ showWave(false); currentWaveId = null; }
    }, 650);
  };

  if (!path){ fallbackBeep(); return; }

  try{
    const audio = new Audio(path);
    currentAudioEl = audio;
    currentWaveId = waveId;

    audio.addEventListener('playing', () => {
      if (myToken !== playToken) return;
      settled = true;
      showWave(true);
    });
    audio.addEventListener('ended', () => {
      if (myToken !== playToken) return;
      showWave(false);
      if (currentAudioEl === audio) currentAudioEl = null;
      if (currentWaveId === waveId) currentWaveId = null;
    });
    audio.addEventListener('error', fallbackBeep);

    // 保險逾時：若 800ms 內既未成功播放、也未觸發 error（例如部分瀏覽器對本機檔案的限制），仍降級為嗶聲
    setTimeout(() => { if (myToken === playToken && !settled) fallbackBeep(); }, 800);

    const p = audio.play();
    if (p && typeof p.catch === 'function') p.catch(fallbackBeep);
  }catch(e){
    fallbackBeep();
  }
}

// ==================== 口說測驗發音評分：音檔轉檔與 API 呼叫 ====================
// 評分 API 要求 wav 檔：Mono, 16KHz, 16bit Linear PCM。
// MediaRecorder 錄出來的預設格式（通常是 webm/opus）不符合，所以錄音結束後
// 立刻在瀏覽器端解碼、重取樣成 16kHz 單聲道，再手動包成標準 WAV 檔。

function encodeWav16kMono(audioBuffer){
  const channelData = audioBuffer.getChannelData(0);
  const numSamples = channelData.length;
  const sampleRate = audioBuffer.sampleRate;
  const bytesPerSample = 2;
  const blockAlign = bytesPerSample;
  const byteRate = sampleRate * blockAlign;
  const dataSize = numSamples * bytesPerSample;

  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  function writeString(offset, str){
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);        // PCM chunk size
  view.setUint16(20, 1, true);         // audio format = 1 (PCM)
  view.setUint16(22, 1, true);         // channels = 1
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);        // bits per sample
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);

  let offset = 44;
  for (let i = 0; i < numSamples; i++, offset += 2){
    const s = Math.max(-1, Math.min(1, channelData[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }

  return new Blob([buffer], { type: 'audio/wav' });
}

async function convertBlobTo16kMonoWav(blob){
  const arrayBuffer = await blob.arrayBuffer();
  const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
  let decoded;
  try{
    decoded = await tempCtx.decodeAudioData(arrayBuffer);
  } finally {
    try{ tempCtx.close(); }catch(e){}
  }
  const targetRate = 16000;
  const offlineCtx = new OfflineAudioContext(1, Math.ceil(decoded.duration * targetRate), targetRate);
  const src = offlineCtx.createBufferSource();
  src.buffer = decoded;
  // 接到單聲道的 offline context 時，Web Audio 會自動把多聲道向下混音為單聲道
  src.connect(offlineCtx.destination);
  src.start(0);
  const rendered = await offlineCtx.startRendering();
  return encodeWav16kMono(rendered);
}

// 呼叫 Vercel 後端進行真實發音評分；任何失敗都回傳 null，由呼叫端負責降級為模擬評分
async function callScoringApi(wavBlob, pinyin, accentId, text){
  const base = scoringEndpointBase();
  if (base === null) return null;
  const url = `${base}/api/score?pinyin=${encodeURIComponent(pinyin || '')}&accentId=${encodeURIComponent(accentId || '1')}&text=${encodeURIComponent(text || '')}`;
  const controller = new AbortController();
  // 逾時保護：比後端的 25 秒稍長一點，讓後端自己優雅逾時、回傳好讀的錯誤訊息，
  // 前端這裡只在後端真的完全沒回應時才會介入強制中斷
  const timeoutId = setTimeout(() => controller.abort(), 28000);
  try{
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'audio/wav' },
      body: wavBlob,
      signal: controller.signal,
    });
    clearTimeout(timeoutId);

    if (!resp.ok){
      // 讀出後端／評分服務回傳的錯誤細節，印到 Console 方便排查（不再靜默失敗）
      let detail = null;
      try{ detail = await resp.json(); }catch(e){ /* 回應不是 JSON，忽略 */ }
      console.warn(`發音評分 API 呼叫失敗（HTTP ${resp.status}），將降級為模擬評分：`, detail || '(無法解析錯誤內容)');
      return null;
    }

    const data = await resp.json();
    if (!data || typeof data.score !== 'number'){
      console.warn('發音評分 API 回傳格式異常，將降級為模擬評分：', data);
      return null;
    }
    return data;
  }catch(e){
    clearTimeout(timeoutId);
    console.warn('發音評分 API 呼叫失敗，將降級為模擬評分：', e);
    return null;
  }
}

  if (!s) return s;
  return s.replace(/\.(wav|png)$/i, '');
}
function esc(s){
  if (s === null || s === undefined) return '';
  return String(s)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;');
}

// ==================== 主渲染分派 ====================
function render(){
  const app = document.getElementById('app');
  let html = '';
  switch(state.screen){
    case 'accent': html = renderAccentScreen(); break;
    case 'reading': html = renderQuestionScreen('reading', '第一大題．閱讀測驗'); break;
    case 'transitionA': html = renderTransitionA(); break;
    case 'listening': html = renderQuestionScreen('listening', '第二大題．聽力測驗'); break;
    case 'transitionB': html = renderTransitionB(); break;
    case 'speaking': html = renderSpeakingScreen(); break;
    case 'result': html = renderResultScreen(); break;
    default: html = '<div class="p-10">未知畫面</div>';
  }
  app.innerHTML = html;
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}

// ==================== 第三大題：口說測驗 ====================

function makeSpeakingState(bank){
  const order = [];
  LEVELS.forEach(lv => {
    const poolIdx = [];
    bank.forEach((q, idx) => { if (q.level === lv) poolIdx.push(idx); });
    // Fisher-Yates 洗牌
    for (let i = poolIdx.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = poolIdx[i]; poolIdx[i] = poolIdx[j]; poolIdx[j] = tmp;
    }
    // 每級抽 3 題（保護機制：若該級題庫不足 3 題，則有多少取多少）
    order.push(...poolIdx.slice(0, 3));
  });
  return { bank: bank, order: order, pos: 0, finished: false, log: [] };
}

function startSpeakingSection(){
  state.speaking = makeSpeakingState(speakingQuestions);
  resetRecordingState();
}

function skipSpeaking(){
  if (!state.speaking) return;
  state.speaking.skipped = true;
  state.speaking.finished = true;
  releaseMicStream();
  goToResult();
}

// ---------- 錄音狀態（模組層級） ----------
// mediaStream 是整個口說測驗過程中共用的麥克風串流：只在第一次錄音時跟瀏覽器要一次權限，
// 之後每一題都重複使用同一個串流建立新的 MediaRecorder，不會每題都重新彈出授權視窗。
// 只有在整個口說測驗結束、被跳過、或重新開始測驗時，才會真正關閉麥克風（釋放硬體）。
let mediaStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let recordedBlobUrl = null;      // 給「播放試聽」用的原始錄音（瀏覽器預設格式）
let recordedWavBlob = null;      // 轉成 16kHz 單聲道 WAV，給發音評分 API 用
let recordingStatus = 'idle';    // idle | recording | processing | recorded | unsupported | error
let micErrorMsg = null;
let recordSeconds = 0;
let recordTimerHandle = null;
let submittingSpeaking = false;  // 「確認送出」後、評分結果回來前的過渡狀態

function mediaSupported(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}

// 每秒更新錄音計時文字時，只改文字內容本身，刻意不呼叫 render()（不重畫整個畫面）。
// 如果每秒都重畫整個畫面，錄音按鈕的 CSS 抖動光暈動畫（recordPulse）會被強制從頭開始
// 播放，跟原本正在跑的動畫時間點對不上，看起來就會像按鈕在「抖動」；
// 改成只更新文字內容，按鈕本身完全不被重新建立，動畫才能連續順暢播放。
function updateRecordTimerText(){
  const el = document.getElementById('record-timer-text');
  if (el){
    el.textContent = `錄音中…${recordSeconds} 秒（點擊停止錄音）`;
  } else {
    // 保險：萬一畫面狀態跟預期不同，還是重畫一次確保不會顯示錯誤
    render();
  }
}

function micStreamIsLive(){
  return !!(mediaStream && mediaStream.getTracks().some(t => t.readyState === 'live'));
}

// 真正關閉麥克風硬體（釋放權限指示燈）。只在離開整個口說測驗時呼叫。
function releaseMicStream(){
  if (mediaStream){
    try{ mediaStream.getTracks().forEach(t => t.stop()); }catch(e){}
    mediaStream = null;
  }
}

// 每題之間呼叫：只重置「這一題」的錄音內容，刻意不釋放麥克風串流，
// 這樣下一題按「開始錄音」才不會又跳出一次權限請求。
function resetRecordingState(){
  if (recordTimerHandle){ clearInterval(recordTimerHandle); recordTimerHandle = null; }
  if (mediaRecorder && mediaRecorder.state === 'recording'){
    try{ mediaRecorder.stop(); }catch(e){}
  }
  mediaRecorder = null;
  recordedChunks = [];
  if (recordedBlobUrl){
    try{ URL.revokeObjectURL(recordedBlobUrl); }catch(e){}
    recordedBlobUrl = null;
  }
  recordedWavBlob = null;
  recordingStatus = mediaSupported() ? 'idle' : 'unsupported';
  micErrorMsg = null;
  recordSeconds = 0;
  submittingSpeaking = false;
}

function beginRecordingWithStream(stream){
  recordedChunks = [];
  try{
    mediaRecorder = new MediaRecorder(stream);
  }catch(e){
    micErrorMsg = '無法啟動錄音器：' + (e && e.message ? e.message : String(e));
    recordingStatus = 'error';
    render();
    return;
  }
  mediaRecorder.addEventListener('dataavailable', e => {
    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
  });
  mediaRecorder.addEventListener('stop', async () => {
    // 注意：這裡刻意不釋放 stream（不呼叫 releaseMicStream），
    // 讓麥克風在整個口說測驗期間保持授權狀態，下一題才不用重新問一次權限。
    if (recordTimerHandle){ clearInterval(recordTimerHandle); recordTimerHandle = null; }

    let blob;
    try{
      blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      if (recordedBlobUrl){ URL.revokeObjectURL(recordedBlobUrl); }
      recordedBlobUrl = URL.createObjectURL(blob);
    }catch(e){
      micErrorMsg = '錄音處理失敗：' + (e && e.message ? e.message : String(e));
      recordingStatus = 'error';
      render();
      return;
    }

    // 轉成評分 API 要求的 16kHz 單聲道 WAV（僅在有設定評分後端時才需要，
    // 但轉檔本身不影響「播放試聽」功能，所以無論如何都嘗試轉一次）
    recordingStatus = 'processing';
    render();
    try{
      recordedWavBlob = await convertBlobTo16kMonoWav(blob);
      recordingStatus = 'recorded';
    }catch(e){
      // 轉檔失敗不影響繼續作答：仍可播放試聽／送出，只是屆時會降級為模擬評分
      console.warn('音檔轉換為 WAV 失敗，該題將以模擬評分送出：', e);
      recordedWavBlob = null;
      recordingStatus = 'recorded';
    }
    render();
  });
  mediaRecorder.start();
  recordingStatus = 'recording';
  recordSeconds = 0;
  recordTimerHandle = setInterval(() => { recordSeconds += 1; updateRecordTimerText(); }, 1000);
  render();
}

function startRecording(){
  if (!mediaSupported()){
    recordingStatus = 'unsupported';
    render();
    return;
  }

  // 已經授權過、串流還活著的話直接重複使用，不再重新跳出權限請求
  if (micStreamIsLive()){
    beginRecordingWithStream(mediaStream);
    return;
  }

  navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
    mediaStream = stream;
    beginRecordingWithStream(stream);
  }).catch(err => {
    micErrorMsg = (err && err.message) ? err.message : '無法取得麥克風權限';
    recordingStatus = 'error';
    render();
  });
}

function stopRecording(){
  if (mediaRecorder && mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
  }
}

function playPreview(){
  if (!recordedBlobUrl) return;
  const audio = new Audio(recordedBlobUrl);
  audio.play().catch(() => {});
}

function retryRecording(){
  if (recordedBlobUrl){
    try{ URL.revokeObjectURL(recordedBlobUrl); }catch(e){}
    recordedBlobUrl = null;
  }
  recordedChunks = [];
  recordedWavBlob = null;
  recordingStatus = 'idle';
  micErrorMsg = null;
  recordSeconds = 0;
  render();
}

// ---------- 畫面 ----------
function renderSpeakingScreen(){
  const cat = state.speaking;
  if (!cat || cat.pos >= cat.order.length){
    return '<div class="p-10">口說測驗載入中…</div>';
  }
  const qIdx = cat.order[cat.pos];
  const q = cat.bank[qIdx];
  const total = cat.order.length;
  const seq = cat.pos + 1;

  const canSubmit = !submittingSpeaking && (
    recordingStatus === 'recorded' || recordingStatus === 'unsupported' || recordingStatus === 'error'
  );
  const isFirstQuestion = cat.pos === 0;
  const skipBlock = (isFirstQuestion && !submittingSpeaking) ? `
    <div class="w-full max-w-xs flex justify-end mt-2">
      <button onclick="skipSpeaking()" class="text-[12px] underline" style="color:var(--ink-soft);">跳過口說大題</button>
    </div>` : '';

  let controls = '';
  if (recordingStatus === 'unsupported'){
    controls = `
      <div class="rounded-xl p-4 text-center text-[13px]" style="background:var(--clay-soft); color:var(--clay);">
        此瀏覽器或環境不支援錄音功能，將以模擬評分送出，不影響測驗進行。
      </div>`;
  } else if (recordingStatus === 'error'){
    controls = `
      <div class="rounded-xl p-4 mb-3 text-center text-[13px]" style="background:var(--clay-soft); color:var(--clay);">
        麥克風存取失敗${micErrorMsg ? '：' + esc(micErrorMsg) : ''}，將以模擬評分送出，不影響測驗進行。
      </div>
      <div class="flex justify-center">
        <button onclick="startRecording()" class="btn-ghost rounded-full px-6 py-2.5 text-[14px]">重試錄音</button>
      </div>`;
  } else if (recordingStatus === 'recording'){
    controls = `
      <div class="flex flex-col items-center gap-3">
        <button onclick="stopRecording()" class="record-btn recording rounded-full w-20 h-20 flex items-center justify-center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="6" y="6" width="12" height="12" rx="2" fill="#fff"/></svg>
        </button>
        <span class="text-[13px]" id="record-timer-text" style="color:var(--clay);">錄音中…${recordSeconds} 秒（點擊停止錄音）</span>
      </div>`;
  } else if (recordingStatus === 'processing'){
    controls = `
      <div class="flex flex-col items-center gap-3">
        <div class="record-btn rounded-full w-20 h-20 flex items-center justify-center" style="opacity:.6;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3v3M12 18v3M3 12h3M18 12h3" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="text-[13px]" style="color:var(--ink-soft);">音檔處理中…</span>
      </div>`;
  } else if (recordingStatus === 'recorded'){
    controls = `
      <div class="flex flex-col items-center gap-4">
        <div class="flex items-center gap-2" style="color:var(--moss);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="text-[13px] font-medium">錄音完成</span>
        </div>
        <div class="flex gap-3">
          <button onclick="playPreview()" class="btn-ghost rounded-full px-5 py-2.5 text-[14px] flex items-center gap-2">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 9v6h4l5 5V4L9 9H5z" fill="currentColor"/></svg>
            播放試聽
          </button>
          <button onclick="retryRecording()" class="btn-ghost rounded-full px-5 py-2.5 text-[14px] flex items-center gap-2">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 4v5h5M20 20v-5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 9a7 7 0 0112-4.4M19 15a7 7 0 01-12 4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            重新錄音
          </button>
        </div>
      </div>`;
  } else {
    // idle
    controls = `
      <div class="flex flex-col items-center gap-3">
        <button onclick="startRecording()" class="record-btn rounded-full w-20 h-20 flex items-center justify-center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" fill="#fff"/><path d="M19 11a7 7 0 01-14 0M12 19v3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <span class="text-[13px]" style="color:var(--ink-soft);">開始錄音</span>
      </div>`;
  }

  return `
  <div class="flex-1 flex flex-col px-5 pt-6 pb-36 fade-in">
    <div class="max-w-xl w-full mx-auto flex-1 flex flex-col">

      <div class="flex items-center justify-between mb-6">
        <span class="font-display text-[15px] font-semibold" style="color:var(--indigo-5);">第三大題．口說測驗</span>
        <span class="text-[13px]" style="color:var(--ink-soft);">第 ${seq}/${total} 題 ｜ 第 ${q.level} 級</span>
      </div>

      <div class="flex justify-center mb-4">
        <span class="text-[12px] px-3 py-1.5 rounded-full font-medium" style="background:var(--indigo-1); color:var(--indigo-5);">
          【作答提示：${esc(q.type)}】
        </span>
      </div>

      <div class="q-card rounded-2xl p-7 mb-6 text-center">
        <p class="font-display text-xl md:text-2xl font-medium leading-relaxed">${esc(q.question)}</p>
      </div>

      <div class="q-card rounded-2xl p-7">
        ${controls}
      </div>

    </div>
  </div>

  <div class="fixed bottom-0 inset-x-0 px-5 py-4 flex flex-col items-center" style="background:rgba(246,241,228,0.95); backdrop-filter:blur(6px); border-top:1px solid var(--paper-deep);">
    <button onclick="confirmSpeakingSubmit()" ${canSubmit ? '' : 'disabled'} class="btn-primary rounded-full px-10 py-3.5 font-medium text-[15px] w-full max-w-xs disabled:opacity-40 flex items-center justify-center gap-2">
      ${submittingSpeaking ? '<span class="spinner"></span> 評分中，請稍候…' : '確認送出'}
    </button>
    ${skipBlock}
  </div>`;
}

// ---------- 作答處理：優先呼叫真實發音評分 API，失敗則自動降級為模擬評分 ----------
async function confirmSpeakingSubmit(){
  const cat = state.speaking;
  if (!cat || submittingSpeaking) return;
  const qIdx = cat.order[cat.pos];
  const q = cat.bank[qIdx];

  submittingSpeaking = true;
  render();

  let score = null;
  let simulated = true;

  if (recordedWavBlob){
    const result = await callScoringApi(recordedWavBlob, q.romanization, '1', q.question);
    if (result && typeof result.score === 'number'){
      score = Math.round(result.score);
      simulated = false;
    }
  }

  if (score === null){
    // 防卡死：沒有錄音、轉檔失敗、評分後端未設定，或呼叫失敗時，一律降級為模擬分數
    score = Math.round(60 + Math.random() * 40);
    simulated = true;
  }

  // 逐字標準／不標準：評分 API 只會回傳整題總分，沒有逐字資料，
  // 所以用「總分 = 每個字判定為標準的機率」來還原逐字呈現
  // （分數越高，字被標示為「標準」的機率越高）；模擬分數同樣套用這個換算方式。
  const standardProb = Math.max(0, Math.min(1, score / 100));
  const chars = Array.from(q.target).map(ch => ({ char: ch, standard: Math.random() < standardProb }));

  cat.log.push({
    seq: cat.pos + 1,
    level: q.level,
    type: q.type,
    question: q.question,
    target: q.target,
    score: score,
    simulated: simulated,
    chars: chars,
  });

  cat.pos += 1;
  submittingSpeaking = false;
  resetRecordingState();

  if (cat.pos >= cat.order.length){
    cat.finished = true;
    releaseMicStream();
    state.screen = 'result';
  }
  render();
}

// ---------- 結果區塊 ----------
function renderSpeakingResultItem(item){
  const charsHtml = item.chars.map(c => `
    <span class="char-chip ${c.standard ? 'char-standard' : 'char-nonstandard'}">${esc(c.char)}<span class="char-chip-tag">${c.standard ? '標準' : '不標準'}</span></span>
  `).join('');
  return `
    <div class="result-item rounded-xl p-4">
      <div class="flex items-center gap-2 mb-2 flex-wrap">
        <span class="text-[13px] font-semibold" style="color:var(--indigo-5);">第 ${item.seq} 題（第 ${item.level} 級）</span>
        <span class="text-[11px] px-2 py-0.5 rounded-full" style="background:var(--indigo-1); color:var(--indigo-5);">【作答提示：${esc(item.type)}】</span>
        ${item.simulated ? '<span class="text-[11px] px-2 py-0.5 rounded-full" style="background:var(--paper-deep); color:var(--ink-soft);">模擬結果</span>' : ''}
      </div>
      <div class="text-[13.5px] mb-3" style="color:var(--ink-soft);">
        題目：<span style="color:var(--ink);">${esc(item.question)}</span> ｜ 目標客語：<span style="color:var(--ink);">${esc(item.target)}</span>
      </div>
      <div class="text-[12.5px] mb-2" style="color:var(--ink-soft);">語音辨識評估：</div>
      <div class="flex flex-wrap gap-2">
        ${charsHtml}
      </div>
    </div>`;
}

function renderSpeakingResultBlock(cat){
  if (!cat || cat.skipped){
    return `
      <div class="mb-10">
        <h3 class="font-display text-lg font-bold mb-1">口說測驗結果</h3>
        <div class="result-item rounded-xl p-5 text-center" style="color:var(--ink-soft);">
          本大題未作答
        </div>
      </div>`;
  }
  if (!cat.log.length){
    return `
      <div class="mb-10">
        <h3 class="font-display text-lg font-bold mb-1">口說測驗結果</h3>
        <div class="result-item rounded-xl p-5 text-center" style="color:var(--ink-soft);">
          暫無評估數據
        </div>
      </div>`;
  }
  const allChars = cat.log.flatMap(item => item.chars);
  const standardCount = allChars.filter(c => c.standard).length;
  const anySimulated = cat.log.some(x => x.simulated);
  return `
    <div class="mb-10">
      <h3 class="font-display text-lg font-bold mb-1">口說測驗結果</h3>
      <p class="text-[13px] mb-4" style="color:var(--ink-soft);">
        共作答 ${cat.log.length} 題．單字語音辨識評估：標準 ${standardCount}／${allChars.length} 字${anySimulated ? '（部分題目為模擬結果，詳見各題標示）' : ''}
      </p>
      <div class="flex flex-col gap-2.5">
        ${cat.log.map(renderSpeakingResultItem).join('')}
      </div>
    </div>`;
}

// ==================== 啟動 ====================
render();
</script>
</body>
</html>
